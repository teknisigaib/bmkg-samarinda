name: Deploy via Self-Hosted Runner

on:
  push:
    branches: [ "main" ] 

# Variabel Global 
env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/bmkg-samarinda:latest
  CONTAINER_NAME: bmkg-samarinda
  ENV_PATH: /www/wwwroot/bmkg-samarinda/.env 

jobs:
  # TAHAP 1: BUILD 
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ secrets.NEXT_PUBLIC_STORAGE_URL }}

  # TAHAP 2: DEPLOY
  deploy_local:
    needs: build_and_push
    runs-on: self-hosted 
    
    steps:
      - name: Login Docker di Local
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tarik Image Terbaru
        run: docker pull ${{ env.IMAGE_NAME }}

      - name: Hapus Container Lama
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true

      - name: Jalankan Container Baru
        run: |
          docker run -d \
            -p 3000:3000 \
            --name ${{ env.CONTAINER_NAME }} \
            --restart always \
            -v stamet_nginx_logs:/www/wwwlogs:ro \
            -v /www/wwwroot/storage:/app/public/storage \
            --add-host stamet-samarinda.bmkg.go.id:host-gateway \
            --env-file ${{ env.ENV_PATH }} \
            ${{ env.IMAGE_NAME }}

      - name: Update Database (Prisma)
        run: |
          # 1. Ambil DATABASE_URL murni dari file .env
          THE_URL=$(grep "^DATABASE_URL=" ${{ env.ENV_PATH }} | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r')
          
          # 2. Cek Debugging 
          echo "Debug: URL Terambil = ${THE_URL:0:10}..."

          if [ -z "$THE_URL" ]; then
            echo "FATAL: Gagal mengambil DATABASE_URL dari ${{ env.ENV_PATH }}"
            exit 1
          fi

          # 3. Jalankan Prisma dengan DATABASE_URL biasa
          docker exec -u 0 \
          -e DATABASE_URL="$THE_URL" \
          ${{ env.CONTAINER_NAME }} \
          npx prisma@5.22.0 db push --skip-generate
          
      - name: Bersih-bersih Image Sampah
        run: docker image prune -f